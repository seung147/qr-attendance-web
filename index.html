<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>교육 출석관리 · 대륜E&S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style id="pagestyle"></style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="app"><div class="empty">불러오는 중…</div></div>
<script>
const CFG = window.APP_CONFIG || {};
const ORG = CFG.ORG || '대륜E&S';
const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nobr = t => `<span style="display:inline-block">${t}</span>`;
const fmtTitle = t => esc(t).replace(/\(([^)]*)\)/g, (m) => nobr(m));
const pad = n => String(n).padStart(2,'0');
const hms = t => { if(!t) return ''; const d=new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const stamp = t => { const d=new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const cleanId = s => String(s||'').trim().replace(/[^A-Za-z0-9_\-]/g,'');
// 사내전화번호: 엑셀이 앞자리 0을 지운 경우(162) 4자리(0162)로 복원
const fixExt = v => { v=String(v||'').trim(); return /^\d{1,3}$/.test(v) ? v.padStart(4,'0') : v; };
const ms = v => v ? Date.parse(v) : null;
const PHASE = { idle:['대기','p-idle'], in:['입실 인증 중','p-in'], out:['퇴실 인증 중','p-out'], closed:['마감','p-idle'] };
const RCLS = {'이수':'p-ok','확인필요':'p-warn','동일기기 중복인증':'p-warn','미이수':'p-bad','불참':'p-bad'};

const st = { roster:[], sessions:[], checkins:[], loaded:false, filter:'all', rq:'', rteam:'', update:null, poll:null, email:'' };

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
function ask(msg, okLabel='확인'){ return new Promise(res=>{
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog"><div>${esc(msg)}</div><div class="row" style="justify-content:flex-end"><button class="btn" id="askNo">취소</button><button class="btn pri" id="askOk">${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector('#askNo').onclick=()=>{bg.remove();res(false)};
  bg.querySelector('#askOk').onclick=()=>{bg.remove();res(true)};
});}
function fail(error){ if(error){ console.error(error); toast('처리하지 못했습니다: '+(error.message||error)); return true; } return false; }

/* ---------- 데이터 ---------- */
const mapEmp = r => ({id:r.id, team:r.team, name:r.name, empNo:r.emp_no, ext:r.ext||''});
const mapSes = r => ({id:r.id, course:r.course, round:r.round, date:r.edu_date, start:r.start_time, end:r.end_time, place:r.place, lecturer:r.lecturer,
  minMinutes:r.min_minutes, targetTeams:r.target_teams||[], targetEmpNos:r.target_emp_nos||[], requireEmpNo:r.require_emp_no, phase:r.phase});
const mapChk = r => ({id:r.id, sid:r.session_id, empNo:r.emp_no, team:r.team, name:r.name, ext:r.ext||'', inAt:ms(r.in_at), outAt:ms(r.out_at),
  inDev:r.in_device, outDev:r.out_device, inManual:r.in_manual, outManual:r.out_manual, override:r.override||''});

async function fetchAll(table, build){ // Supabase는 한 번에 1000행까지라 나눠서 읽음
  const out=[]; for(let from=0;;from+=1000){
    const {data,error}=await build(sb.from(table).select('*')).range(from,from+999);
    if(error) throw error; out.push(...data); if(data.length<1000) break; }
  return out;
}
const sortRoster = l => l.sort((a,b)=>a.team.localeCompare(b.team,'ko')||a.name.localeCompare(b.name,'ko'));
async function loadAll(){
  try{
    const [e,s,c]=await Promise.all([fetchAll('employees',q=>q.eq('active',true)), fetchAll('sessions',q=>q), fetchAll('checkins',q=>q)]);
    st.roster=sortRoster(e.map(mapEmp)); st.sessions=s.map(mapSes); st.checkins=c.map(mapChk); st.loaded=true; render();
  }catch(err){ fail(err); }
}
async function loadSession(sid){
  const [{data:s,error:e1},{data:c,error:e2}]=await Promise.all([sb.from('sessions').select('*').eq('id',sid).maybeSingle(), sb.from('checkins').select('*').eq('session_id',sid)]);
  if(e1||e2) return;
  st.sessions=st.sessions.filter(x=>x.id!==sid); if(s) st.sessions.push(mapSes(s));
  st.checkins=st.checkins.filter(x=>x.sid!==sid).concat((c||[]).map(mapChk)); render();
}
function render(){ if(st.update) st.update(); }

/* ---------- 판정 ---------- */
function dupIds(list){
  const by={}; for(const c of list) for(const u of [c.inDev,c.outDev]){ if(!u) continue; (by[u]=by[u]||new Set()).add(c.empNo); }
  const dup=new Set(); for(const c of list) for(const u of [c.inDev,c.outDev]) if(u&&by[u].size>1) dup.add(c.id);
  return dup;
}
function judge(c,s,dup){
  const mins = c.inAt&&c.outAt ? Math.floor((c.outAt-c.inAt)/60000) : null, notes=[];
  if(!c.inAt) notes.push('입실 미확인');
  if(!c.outAt) notes.push('퇴실 미확인');
  if(c.inManual) notes.push('입실 수동등록('+c.inManual+')');
  if(c.outManual) notes.push('퇴실 수동등록('+c.outManual+')');
  let auto;
  if(mins!==null && mins<(s.minMinutes||0)) notes.unshift('체류 '+mins+'분');
  if(dup.has(c.id)) auto='동일기기 중복인증';   // 담당자가 확인 후 판정을 이수/불참 등으로 변경
  else if(mins!==null && mins<(s.minMinutes||0)) auto='미이수';
  else if(notes.some(n=>!n.includes('수동등록'))) auto='확인필요';
  else auto='이수';
  return {mins, auto, result:c.override||auto, notes:notes.join(', ')};
}
const teams = () => [...new Set(st.roster.map(e=>e.team))].sort((a,b)=>a.localeCompare(b,'ko'));
const byTeamName = (a,b) => (a.team||'').localeCompare(b.team||'','ko') || (a.name||'').localeCompare(b.name||'','ko');
// 대상자: 사번 지정 > 팀 지정 > 전체
const restricted = s => s.targetEmpNos.length>0 || s.targetTeams.length>0;
function isTarget(s, empNo, team){
  if(s.targetEmpNos.length) return s.targetEmpNos.includes(empNo);
  if(s.targetTeams.length) return s.targetTeams.includes(team);
  return true;
}
function targets(s){ return st.roster.filter(e=>isTarget(s,e.empNo,e.team)); }
function rows(s){
  const list=st.checkins.filter(c=>c.sid===s.id), dup=dupIds(list);
  return list.map(c=>({c, moved: restricted(s) && !isTarget(s,c.empNo,c.team), ...judge(c,s,dup)})).sort((a,b)=>byTeamName(a.c,b.c));
}
function summary(s){
  const r=rows(s), tg=targets(s), sm=new Map(st.sessions.map(x=>[x.id,x]));
  const att=r.filter(x=>x.c.inAt);            // 입실 기록이 있어야 참석 (퇴실만 있는 기록은 출석부에서 제외)
  const done=new Set(att.map(x=>x.c.empNo));
  const missing=[], other=[]; // other: 이 회차 대상인데 같은 과정의 다른 회차를 들은 사람
  tg.filter(e=>!done.has(e.empNo)).forEach(e=>{
    const o=st.checkins.find(c=>c.empNo===e.empNo && c.sid!==s.id && c.inAt && sm.get(c.sid)?.course===s.course);
    if(o) other.push({e, round:sm.get(o.sid).round}); else missing.push(e);
  });
  return { r, att, tg, missing, other, moved:att.filter(x=>x.moved).length, dupN:r.filter(x=>x.result==='동일기기 중복인증').length, inN:r.filter(x=>x.c.inAt).length, outN:r.filter(x=>x.c.outAt).length,
    ok:r.filter(x=>x.result==='이수').length, warn:r.filter(x=>x.result==='확인필요').length, bad:r.filter(x=>x.result==='미이수').length };
}
// 출석부·CSV용: 참석자 + 타회차 수강자 + 불참자를 팀 → 이름(가나다) 순으로
function sheetRows(s){
  const m=summary(s);
  return [
    ...m.att.map(x=>({team:x.c.team,empNo:x.c.empNo,name:x.c.name,ext:x.c.ext,inAt:x.c.inAt,outAt:x.c.outAt,mins:x.mins,result:x.result,notes:x.notes,blue:x.moved?'차수변경':''})),
    ...m.other.map(o=>({team:o.e.team,empNo:o.e.empNo,name:o.e.name,ext:o.e.ext,inAt:null,outAt:null,mins:null,result:'타회차',notes:'',blue:`차수변경(${o.round} 수강)`})),
    ...m.missing.map(e=>({team:e.team,empNo:e.empNo,name:e.name,ext:e.ext,inAt:null,outAt:null,mins:null,result:'불참',notes:'미인증',blue:''}))
  ].sort(byTeamName);
}
const noteText = x => [x.blue, x.notes].filter(Boolean).join(', ');
const noteHTML = x => [x.blue?`<span class="blue">${esc(x.blue)}</span>`:'', esc(x.notes)].filter(Boolean).join(', ');

/* ---------- 내보내기 ---------- */
function csv(lines){ return '﻿'+lines.map(l=>l.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\r\n'); }
function download(name, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500); }
function sessionLines(s){
  const L=[['연번','부서명','사번','이름','사내번호','입실','퇴실','체류(분)','결과','비고']];
  sheetRows(s).forEach((x,i)=>L.push([i+1,x.team,x.empNo,x.name,x.ext,hms(x.inAt),hms(x.outAt),x.mins??'',x.result,noteText(x)]));
  return L;
}
function allLines(){ // 전체 회차 취합
  const L=[['교육일','교육과정','회차','부서명','사번','이름','사내번호','입실','퇴실','체류(분)','결과','비고']];
  st.sessions.slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).forEach(s=>{
    sheetRows(s).forEach(x=>L.push([s.date,s.course,s.round,x.team,x.empNo,x.name,x.ext,hms(x.inAt),hms(x.outAt),x.mins??'',x.result,noteText(x)]));
  });
  return L;
}

/* ---------- 로그인 ---------- */
async function boot(){
  if(!CFG.SUPABASE_URL || CFG.SUPABASE_URL.includes('YOUR-PROJECT')){
    app.innerHTML=`<div class="login card"><h1 style="font-size:18px">설정이 필요합니다</h1><p class="muted">config.js 에 Supabase 주소와 anon key를 넣어 주세요. (README 2단계)</p></div>`; return;
  }
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return showLogin();
  st.email=session.user.email;
  const {data:isAdmin,error}=await sb.rpc('is_admin');
  if(error||!isAdmin){
    app.innerHTML=`<div class="login card"><h1 style="font-size:18px">관리자 등록이 필요합니다</h1><p class="muted">${esc(st.email)} 계정이 admins 목록에 없습니다. Supabase SQL Editor에서 등록해 주세요. (README 3단계)</p><button class="btn" id="lo">로그아웃</button></div>`;
    document.getElementById('lo').onclick=async()=>{await sb.auth.signOut();location.reload()}; return;
  }
  window.addEventListener('hashchange', route);
  await loadAll(); route();
}
function showLogin(){
  app.innerHTML=`<div class="login"><div class="card" style="display:flex;flex-direction:column;gap:14px">
   <div class="brand" style="color:var(--navy);flex-direction:column;align-items:flex-start;gap:8px"><img src="logo.png" alt="${esc(ORG)}" style="height:34px">교육 출석관리</div>
   <form id="lf" style="display:flex;flex-direction:column;gap:12px">
    <label class="f">이메일<input class="in" type="email" id="le" required autocomplete="username"></label>
    <label class="f">비밀번호<input class="in" type="password" id="lp" required autocomplete="current-password"></label>
    <div id="lerr" class="note"></div><button class="btn pri">로그인</button></form>
   <p class="muted small" style="margin:0">인사팀 관리자 전용 화면입니다. 직원은 교육장 QR로 인증합니다.</p></div></div>`;
  document.getElementById('lf').onsubmit=async ev=>{
    ev.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:document.getElementById('le').value.trim(),password:document.getElementById('lp').value});
    if(error){ document.getElementById('lerr').textContent='이메일 또는 비밀번호가 맞지 않습니다.'; return; }
    location.reload();
  };
}

function route(){
  clearInterval(st.poll); st.poll=null; st.update=null;
  const h=location.hash.slice(1);
  if(h.startsWith('qr-')) return mountQR(h.slice(3));
  if(h.startsWith('sqr-')) return mountSurveyQR(h.slice(4));
  if(h.startsWith('survey-')) return mountSurvey(h.slice(7));
  if(h.startsWith('sheet-')) return mountSheet(h.slice(6));
  if(h.startsWith('s-')) return mountSession(h.slice(2));
  if(h==='roster') return mountRoster();
  if(h==='status') return mountStatus();
  return mountList();
}
function shell(active, inner){
  setTimeout(()=>{ const b=document.getElementById('logout'); if(b) b.onclick=async()=>{await sb.auth.signOut();location.hash='';location.reload()}; });
  return `<header class="topbar"><div class="brand"><span class="logo-chip"><img src="logo.png" alt="${esc(ORG)}"></span>교육 출석관리</div>
  <nav class="nav"><a href="#sessions" class="${active==='sessions'?'on':''}">교육 회차</a><a href="#status" class="${active==='status'?'on':''}">이수 현황</a><a href="#roster" class="${active==='roster'?'on':''}">직원 명단</a></nav>
  <span class="small" style="opacity:.8">${esc(st.email)}</span><button class="btn sm" id="logout">로그아웃</button></header><main class="wrap">${inner}</main>`;
}

/* ---------- 회차 목록 ---------- */
function mountList(){
  app.innerHTML=shell('sessions',`
  <div class="row between"><h1 style="font-size:20px">교육 회차</h1><div class="row"><button class="btn" id="allCsv">전체 출석 기록 CSV</button><button class="btn pri" id="newS">+ 새 회차 만들기</button></div></div>
  <section class="card"><h2>회차 목록</h2><div id="slist"></div></section>`);
  document.getElementById('newS').onclick=()=>sessionForm();
  document.getElementById('allCsv').onclick=()=>download(`교육출석_전체_${stamp(Date.now()).slice(0,10)}.csv`, csv(allLines()));
  st.update=()=>{
    const el=document.getElementById('slist'); if(!el) return;
    if(!st.loaded){ el.innerHTML=`<div class="empty">불러오는 중…</div>`; return; }
    const list=st.sessions.slice().sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start));
    if(!list.length){ el.innerHTML=`<div class="empty">아직 만든 회차가 없습니다. [+ 새 회차 만들기]로 첫 교육을 등록하세요.</div>`; return; }
    el.innerHTML=list.map(s=>{const m=summary(s),ph=PHASE[s.phase]||PHASE.idle;return`
      <a class="sess" href="#s-${esc(s.id)}"><div><h3>${esc(s.course)} <span style="color:var(--blue)">${esc(s.round)}</span></h3>
      <div class="muted small tnum">${esc(s.date)} ${esc(s.start)}~${esc(s.end)} · ${esc(s.place)} · 대상 ${m.tg.length}명 · 입실 ${m.inN} · 이수 ${m.ok} · 확인필요 ${m.warn} · 미인증 ${m.missing.length}</div></div>
      <div class="row"><span class="pill ${ph[1]}">${ph[0]}</span><span class="chev" aria-hidden="true">›</span></div></a>`}).join('');
  };
  render();
}

function sessionForm(s){
  const e=s||{course:'2026년 법정의무교육(성희롱·괴롭힘 예방교육)',round:'1회차',date:'',start:'10:00',end:'11:00',place:'본사 대회의실',lecturer:'',minMinutes:55,targetTeams:[],requireEmpNo:false};
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<form class="modal" id="sf"><h2 style="font-size:17px">${s?'회차 수정':'새 회차 만들기'}</h2>
  <label class="f">교육과정 <span class="small">— 같은 교육을 여러 날 나눠 하면 이름을 똑같이 (목록에서 고르기)</span><input class="in" id="f_course" required value="${esc(e.course)}" list="courselist" autocomplete="off"><datalist id="courselist">${[...new Set(st.sessions.map(x=>x.course))].sort((x,y)=>x.localeCompare(y,'ko')).map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
  <div class="grid">
   <label class="f">회차<input class="in" id="f_round" required value="${esc(e.round)}" placeholder="예) 1회차(오전)"></label>
   <label class="f">교육일<input class="in" type="date" id="f_date" required value="${esc(e.date)}"></label>
   <label class="f">시작<input class="in" type="time" id="f_start" required value="${esc(e.start)}"></label>
   <label class="f">종료<input class="in" type="time" id="f_end" required value="${esc(e.end)}"></label>
   <label class="f">장소<input class="in" id="f_place" value="${esc(e.place)}"></label>
   <label class="f">강사<input class="in" id="f_lect" value="${esc(e.lecturer)}"></label>
   <label class="f">이수 기준(체류 분)<input class="in" type="number" min="0" id="f_min" value="${esc(e.minMinutes)}"></label>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)">대상 부서 (선택 안 하면 명단 전체)
   <div class="teamcks">${teams().map(t=>`<label><input type="checkbox" value="${esc(t)}" ${e.targetTeams.includes(t)?'checked':''}>${esc(t)}</label>`).join('')||'<span>명단을 먼저 등록하세요</span>'}</div></div>
  <label class="f">대상자 사번 지정 (선택) — 엑셀의 사번 열을 복사해 붙여넣으면 부서 선택보다 우선합니다. 대상이 아닌 사람이 인증하면 비고에 '차수변경'으로 표시됩니다.
   <textarea class="in" id="f_emps" style="min-height:70px" placeholder="20150000&#10;20150185">${esc((e.targetEmpNos||[]).join('\n'))}</textarea><span id="f_empsn"></span></label>
  <p class="muted small" style="margin:0">직원은 부서·이름을 고른 뒤 사번과 사내번호를 직접 입력해야 인증됩니다.</p>
  <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="f_cancel">취소</button><button class="btn pri">${s?'저장':'만들기'}</button></div></form>`;
  document.body.appendChild(bg);
  bg.querySelector('#f_cancel').onclick=()=>bg.remove();
  const parseEmps=()=>[...new Set(bg.querySelector('#f_emps').value.split(/[\s,;]+/).map(cleanId).filter(Boolean))];
  const showN=()=>{ const l=parseEmps(), known=l.filter(n=>st.roster.some(r=>r.empNo===n)).length;

    ev.preventDefault(); const g=id=>bg.querySelector('#'+id).value.trim();

const qToText=qs=>qs.map(q=>(q.type==='text'?'[주관식] ':'')+q.text).join('\n');
const textToQ=t=>t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>/^\[주관식\]/.test(l)?{type:'text',text:l.replace(/^\[주관식\]\s*/,'')}:{type:'scale',text:l});

async function setSurveyOpen(sid,open){

  const {error}=await sb.from('surveys').upsert({...row,updated_at:new Date().toISOString()},{onConflict:'session_id'});
  if(!fail(error)){ await loadSurvey(sid); drawSurveyCard(sid); }

function mountSurvey(sid){
  app.innerHTML=shell('sessions',`<div class="row between no-print"><a class="back" href="#s-${esc(sid)}">← 회차로 돌아가기</a>
   <div class="row"><button class="btn" id="svCsv">엑셀(CSV) 다운로드</button><button class="btn pri" onclick="print()">인쇄 / PDF 저장</button></div></div>
   <section class="card print-area" id="svres"><div class="empty">불러오는 중…</div></section>`);
  const getS=()=>st.sessions.find(x=>x.id===sid);
  document.getElementById('svCsv').onclick=()=>{ const v=st.surveys[sid], r=st.resp[sid]||[], s=getS(); if(!v) return;
    const L=[['번호','응답시각',...v.questions.map((q,i)=>`${i+1}. ${q.text}`)]];
    r.forEach((x,i)=>L.push([i+1,stamp(x.created_at),...v.questions.map((q,j)=>x.answers?.[j]??'')]));
    download(`설문결과_${s?.date||''}_${s?.round||''}.csv`,csv(L)); };
  st.update=()=>{
    const el=document.getElementById('svres'), s=getS(), v=st.surveys[sid], r=st.resp[sid]||[]; if(!el) return;
    if(!s||!v){ el.innerHTML=`<div class="empty">${s?'이 회차에는 아직 설문이 없습니다.':'불러오는 중…'}</div>`; return; }
    const att=summary(s).att.length;
    const body=v.questions.map((q,i)=>{
      const vals=r.map(x=>x.answers?.[i]).filter(a=>a!==null&&a!==undefined&&a!=='');
      if(q.type==='text') return `<div class="sv-q" style="grid-template-columns:1fr"><div><p class="sv-t">${i+1}. ${esc(q.text)} <span class="small muted">(주관식 ${vals.length}건)</span></p>
        ${vals.length?`<ul class="sv-texts">${vals.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p class="muted small">응답 없음</p>'}</div></div>`;
      const nums=vals.map(Number).filter(x=>x>=1&&x<=5), avg=nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length):0;
      const cnt=[5,4,3,2,1].map(k=>nums.filter(x=>x===k).length), lab={5:'매우 그렇다',4:'그렇다',3:'보통',2:'그렇지 않다',1:'매우 그렇지 않다'};
      return `<div class="sv-q"><div><p class="sv-t">${i+1}. ${esc(q.text)}</p><p class="sv-avg">${nums.length?avg.toFixed(2):'-'}<span class="small muted"> / 5점 · 긍정(4~5점) ${nums.length?Math.round((cnt[0]+cnt[1])/nums.length*100):0}%</span></p></div>
        <div class="dist">${[5,4,3,2,1].map((k,j)=>`<div class="dist-r"><span>${k} ${lab[k]}</span><div class="dist-b"><i style="width:${nums.length?cnt[j]/nums.length*100:0}%"></i></div><span class="tnum">${cnt[j]}명</span></div>`).join('')}</div></div>`;
    }).join('');
    el.innerHTML=`<div class="print-only"><img src="logo.png" alt="${esc(ORG)}" style="height:22px"></div>
     <div class="row between"><h2>${esc(v.title)} 결과</h2><span class="pill ${v.is_open?'p-ok':'p-idle'} no-print">${v.is_open?'응답 받는 중':'마감'}</span></div>
     <p class="muted small tnum" style="margin:6px 0 14px">${esc(s.course)} ${esc(s.round)} · ${esc(s.date)} · 응답 ${r.length}명 / 입실 ${att}명 (응답률 ${att?Math.round(r.length/att*100):0}%) · 출력일시 ${stamp(Date.now())} · 익명 응답</p>
     ${r.length?body:'<div class="empty">아직 응답이 없습니다.</div>'}`;
  };
  render(); Promise.all([loadSession(sid),loadSurvey(sid)]).then(render);

}

/* ---------- 직원 검색 선택 (수동 등록용) ---------- */
function clearCombo(){ const q=document.getElementById('m_q'); if(!q) return; q.value=''; document.getElementById('m_emp').value=''; }
function setupCombo(){
  const q=document.getElementById('m_q'), hid=document.getElementById('m_emp'), list=document.getElementById('m_list');
  let items=[], active=-1;
  const hl=(t,k)=>{ t=esc(t); if(!k) return t; const i=t.indexOf(esc(k)); return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+esc(k).length)+'</mark>'+t.slice(i+esc(k).length); };
  function open(){
    const k=q.value.trim(); const ks=k.split(/\s+/).filter(Boolean);
    items=st.roster.filter(e=>ks.every(w=>(e.name+' '+e.empNo+' '+e.team).includes(w))).slice(0,50);
    active=items.length?0:-1;
    list.innerHTML= items.length ? items.map((e,i)=>`<li role="option" id="m_opt${i}" data-i="${i}" class="${i===active?'on':''}"><b>${hl(e.name,ks[0]||'')}</b><span>${hl(e.team,ks[0]||'')} · ${hl(e.empNo,ks[0]||'')}</span></li>`).join('')
      : `<li class="none">검색 결과가 없습니다</li>`;
    list.hidden=false; q.setAttribute('aria-expanded','true');
  }
  function close(){ list.hidden=true; q.setAttribute('aria-expanded','false'); }
  function pick(i){ const e=items[i]; if(!e) return; hid.value=e.empNo; q.value=`${e.name} (${e.team} · ${e.empNo})`; close(); }
  function move(d){ if(!items.length) return; active=(active+d+items.length)%items.length;
    list.querySelectorAll('li').forEach((li,i)=>li.classList.toggle('on',i===active));
    const el=document.getElementById('m_opt'+active); el&&el.scrollIntoView({block:'nearest'}); q.setAttribute('aria-activedescendant','m_opt'+active); }
  q.addEventListener('focus',()=>{ if(!hid.value) open(); });
  q.addEventListener('input',()=>{ hid.value=''; open(); });
  q.addEventListener('keydown',ev=>{
    if(ev.key==='ArrowDown'){ ev.preventDefault(); list.hidden?open():move(1); }
    else if(ev.key==='ArrowUp'){ ev.preventDefault(); move(-1); }
    else if(ev.key==='Enter' && !list.hidden){ ev.preventDefault(); pick(active); }
    else if(ev.key==='Escape'){ close(); }
  });
  list.addEventListener('mousedown',ev=>{ const li=ev.target.closest('li[data-i]'); if(li){ ev.preventDefault(); pick(+li.dataset.i); } });
  q.addEventListener('blur',()=>setTimeout(close,100));
}

/* ---------- QR 화면 (빔프로젝터) ---------- */
function mountQR(sid){
  app.innerHTML=`<div class="qr-page"><img class="qr-logo" src="logo.png" alt="${esc(ORG)}"><div class="meta" id="qmeta"></div><h1 id="qtitle">불러오는 중…</h1><div class="phase ph-idle" id="qphase"></div>
   <div class="qrbox" id="qrbox"></div><div class="bar"><i id="qbar" style="width:0"></i></div>
   <div class="muted">휴대폰 카메라로 QR을 스캔한 뒤 <b>부서·이름</b>을 선택하세요 · QR은 30초마다 바뀝니다</div>
   <div class="count" id="qcount"></div>
   <div class="row" style="margin-top:20px;justify-content:center"><button class="btn blue sm" id="qIn">입실 시작</button><button class="btn orange sm" id="qOut">퇴실 시작</button><button class="btn sm" id="qClose">마감</button><button class="btn sm" id="qFull">전체화면</button><a class="btn sm" href="#s-${esc(sid)}">관리 화면</a></div></div>`;
  const getS=()=>st.sessions.find(x=>x.id===sid);
  document.getElementById('qIn').onclick=()=>setPhase(sid,'in');
  document.getElementById('qOut').onclick=()=>setPhase(sid,'out');
  document.getElementById('qClose').onclick=()=>setPhase(sid,'closed');
  document.getElementById('qFull').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{});
  const base=location.href.split('#')[0].replace(/[^/]*$/,'');
  // 게이지: 새 QR이 뜨는 순간 100%에서 시작 → 0%가 되는 순간 다음 QR로 교체
  let token='', nextAt=0, total=30000, drawn='', fetching=false;
  async function refreshToken(){
    if(fetching) return; fetching=true;
    const {data,error}=await sb.rpc('qr_token',{p_session:sid}); fetching=false;
    if(error){ console.error(error); nextAt=Date.now()+3000; total=3000; return; }
    total=Math.max(1000, data.next_in*1000);   // 서버 기준으로 이 QR이 바뀌기까지 남은 시간
    nextAt=Date.now()+total; token=data.token; render();
  }
  const bar=document.getElementById('qbar');
  (function frame(){
    if(!location.hash.startsWith('#qr-')) return;
    const s=getS(), live=s&&(s.phase==='in'||s.phase==='out')&&token;
    const left=nextAt-Date.now();
    bar.style.width= live ? Math.max(0,Math.min(100,left/total*100))+'%' : '0';
    requestAnimationFrame(frame);
  })();
  st.update=()=>{
    const s=getS(); if(!s) return;
    const m=summary(s), live=s.phase==='in'||s.phase==='out';
    document.getElementById('qmeta').textContent=`${s.date} ${s.start}~${s.end} · ${s.place}`;
    document.getElementById('qtitle').innerHTML=`${fmtTitle(s.course)} ${nobr(esc(s.round))}`;
    const pe=document.getElementById('qphase');
    pe.className='phase '+(s.phase==='in'?'ph-in':s.phase==='out'?'ph-out':'ph-idle');
    pe.textContent= s.phase==='in'?'입실 인증':s.phase==='out'?'퇴실 인증':s.phase==='closed'?'인증 마감':'인증 대기';
    document.getElementById('qcount').innerHTML= s.phase==='out'?`퇴실 인증 <b>${m.outN}</b>명 / 입실 ${m.inN}명`:`입실 인증 <b>${m.inN}</b>명 / 대상 ${m.tg.length}명`;
    const box=document.getElementById('qrbox');
    if(!live||!token){ drawn=''; box.innerHTML=`<div>${s.phase==='closed'?'인증이 마감되었습니다':live?'QR 준비 중…':'[입실 시작]을 누르면 QR이 나타납니다'}</div>`; return; }
    const url=`${base}c.html#s=${sid}&t=${token}`;
    if(drawn!==url){ drawn=url; box.innerHTML=''; new QRCode(box,{text:url,width:512,height:512,correctLevel:QRCode.CorrectLevel.M}); }
  };
  render(); loadSession(sid); refreshToken();
  let tick=0;
  st.poll=setInterval(()=>{
    const s=getS(), live=s&&(s.phase==='in'||s.phase==='out');
    if(live && nextAt-Date.now()<=0) refreshToken();
    if(++tick%20===0) loadSession(sid);   // 인원수는 5초마다 갱신
  },250);
}

const RANK={'이수':5,'확인필요':4,'동일기기 중복인증':4,'미이수':3,'불참':2};
const shortCourse=c=>{ const m=String(c||'').match(/\(([^)]+)\)/); return m?m[1]:c; };
function statusData(year){
  const ses=st.sessions.filter(s=>String(s.date).slice(0,4)===year);
  const courses=[...new Set(ses.map(s=>s.course))].sort((a,b)=>a.localeCompare(b,'ko'));
  const best={}; // course -> empNo -> {result, round, date}
  ses.forEach(s=>{ const map=(best[s.course]=best[s.course]||{});
    rows(s).forEach(x=>{ const cur=map[x.c.empNo];
      if(!cur || (RANK[x.result]||0)>(RANK[cur.result]||0)) map[x.c.empNo]={result:x.result,round:s.round,date:s.date}; }); });
  return {courses,best};
}

/* ---------- 직원 명단 ---------- */
function parsePaste(text){
  const out=[], bad=[];
  text.split(/\r?\n/).forEach((line,i)=>{ if(!line.trim()) return;
    if(i===0 && /사번|이름|성명/.test(line)) return;
    const [team,name,empRaw,ext]=line.split(line.includes('\t')?'\t':',').map(x=>x.trim()); const empNo=cleanId(empRaw);
    if(!team||!name||!empNo) bad.push(i+1); else out.push({team,name,emp_no:empNo,ext:fixExt(ext),active:true});
  });
  const map=new Map(out.map(e=>[e.emp_no,e])); return {out:[...map.values()],bad};
}
async function upsertEmployees(list){
  for(let i=0;i<list.length;i+=500){ const {error}=await sb.from('employees').upsert(list.slice(i,i+500),{onConflict:'emp_no'}); if(fail(error)) return false; }
  return true;
}
function mountRoster(){
  app.innerHTML=shell('roster',`<div class="row between"><h1 style="font-size:20px">직원 명단</h1><div class="row"><span class="muted" id="rsum"></span><button class="btn sm" id="rcsv">명단 CSV</button></div></div>
  <section class="card"><h2>엑셀에서 한 번에 등록</h2><p class="muted small" style="margin:6px 0 10px">엑셀에서 <b>부서명 · 이름 · 사번 · 사내번호</b> 순서의 4개 열을 선택해 복사한 뒤 붙여넣으세요. 첫 줄이 제목행이면 건너뜁니다. 사번이 같으면 정보를 고칩니다.</p>
   <textarea class="in" id="paste" placeholder="인사팀	홍길동	20150000	2201&#10;재무팀	정우성	20150185	2301"></textarea>
   <div class="row between" style="margin-top:10px"><div class="row small"><label class="row"><input type="radio" name="pm" value="merge" checked> 기존 명단에 추가·갱신</label><label class="row"><input type="radio" name="pm" value="replace"> 전체 교체 (목록에 없는 직원은 비활성)</label></div>
   <div class="row"><span class="muted small" id="pprev"></span><button class="btn pri" id="pgo">명단 불러오기</button></div></div></section>
  <section class="card"><h2>한 명씩 추가</h2>
   <form class="row" id="radd" style="margin-top:10px"><input class="in" id="a_team" placeholder="부서명" list="teamlist" required><datalist id="teamlist"></datalist>
   <input class="in" id="a_name" placeholder="이름" required><input class="in" id="a_emp" placeholder="사번" required inputmode="numeric"><input class="in" id="a_ext" placeholder="사내번호(4자리)" inputmode="numeric" maxlength="4"><button class="btn pri">추가</button></form></section>
  <section class="card"><div class="row between"><h2>등재 명단</h2><div class="row"><input class="in" id="rq" placeholder="이름·사번 검색" value="${esc(st.rq)}"><select class="in" id="rteam"></select></div></div>
   <div id="rtbl" style="margin-top:12px"></div></section>`);
  const paste=document.getElementById('paste'), prev=document.getElementById('pprev');
  paste.oninput=()=>{ const {out,bad}=parsePaste(paste.value); prev.textContent= paste.value.trim()?`${out.length}명 인식${bad.length?` · 확인 필요 줄: ${bad.slice(0,5).join(', ')}${bad.length>5?'…':''}`:''}`:''; };
  document.getElementById('pgo').onclick=async()=>{
    const {out}=parsePaste(paste.value); if(!out.length){toast('인식된 행이 없습니다. 4개 열(부서명·이름·사번·사내번호)인지 확인하세요.');return}
    const replace=document.querySelector('input[name=pm]:checked').value==='replace';
    if(replace && !await ask(`목록에 없는 기존 직원 ${st.roster.filter(e=>!out.some(o=>o.emp_no===e.empNo)).length}명을 비활성 처리하고 ${out.length}명으로 바꿉니다. 지난 출석 기록은 그대로 남습니다.`,'교체')) return;
    if(!await upsertEmployees(out)) return;
    if(replace){ const keep=new Set(out.map(o=>o.emp_no)); const off=st.roster.filter(e=>!keep.has(e.empNo)).map(e=>e.id);
      for(let i=0;i<off.length;i+=200){ const {error}=await sb.from('employees').update({active:false}).in('id',off.slice(i,i+200)); if(fail(error)) break; } }
    paste.value=''; prev.textContent=''; toast(`${out.length}명을 불러왔습니다.`); loadAll();
  };
  document.getElementById('radd').onsubmit=async ev=>{
    ev.preventDefault(); const g=id=>document.getElementById(id).value.trim();
    const e={team:g('a_team'),name:g('a_name'),emp_no:cleanId(g('a_emp')),ext:fixExt(g('a_ext')),active:true}; if(!e.emp_no){toast('사번은 숫자·영문만 쓸 수 있습니다');return}
    if(!await upsertEmployees([e])) return;
    ['a_name','a_emp','a_ext'].forEach(id=>document.getElementById(id).value=''); document.getElementById('a_name').focus(); loadAll();
  };
  document.getElementById('rcsv').onclick=()=>download('직원명단.csv', csv([['부서명','이름','사번','사내번호'],...st.roster.map(e=>[e.team,e.name,e.empNo,e.ext])]));
  document.getElementById('rq').oninput=ev=>{st.rq=ev.target.value;render()};
  const rteam=document.getElementById('rteam'); rteam.onchange=()=>{st.rteam=rteam.value;render()};
  st.update=()=>{
    const tl=teams();
    document.getElementById('rsum').textContent=`총 ${st.roster.length}명 · ${tl.length}개 부서`;
    document.getElementById('teamlist').innerHTML=tl.map(t=>`<option value="${esc(t)}">`).join('');
    rteam.innerHTML=`<option value="">전체 부서</option>`+tl.map(t=>`<option ${st.rteam===t?'selected':''}>${esc(t)}</option>`).join('');
    const q=st.rq.trim(), list=st.roster.filter(e=>(!st.rteam||e.team===st.rteam)&&(!q||e.name.includes(q)||e.empNo.includes(q)));
    document.getElementById('rtbl').innerHTML= !list.length?`<div class="empty">${st.roster.length?'검색 결과가 없습니다.':'등재된 직원이 없습니다. 엑셀에서 붙여넣거나 한 명씩 추가하세요.'}</div>`:
     `<div class="tbl-wrap"><table class="t"><thead><tr><th>연번</th><th>부서명</th><th>이름</th><th>사번</th><th>사내번호</th><th></th></tr></thead><tbody>${list.map((e,i)=>`<tr><td>${i+1}</td><td>${esc(e.team)}</td><td><b>${esc(e.name)}</b></td><td>${esc(e.empNo)}</td><td>${esc(e.ext)}</td><td><button class="btn sm danger rdel" data-id="${esc(e.id)}" data-n="${esc(e.name)}">삭제</button></td></tr>`).join('')}</tbody></table></div>`;
    document.querySelectorAll('.rdel').forEach(b=>b.onclick=async()=>{ if(!await ask(b.dataset.n+'님을 명단에서 뺍니다. 지난 출석 기록은 남습니다.','빼기')) return;
      const {error}=await sb.from('employees').update({active:false}).eq('id',b.dataset.id); if(!fail(error)) loadAll(); });
  };
  render();
}

boot();
</script>
</body>
</html>
